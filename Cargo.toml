[package]
name = "cozy-spring-jam"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"

# enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# enable a large amount of optimization in the dev profile
# for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
